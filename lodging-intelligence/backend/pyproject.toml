[project]
name = "lodging-intelligence-backend"
version = "0.1.0"
description = "FastAPI backend for the Lodging Intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "pdfplumber>=0.11.4",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pymupdf>=1.24.9",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.2",
  "pytest-mock>=3.14.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

